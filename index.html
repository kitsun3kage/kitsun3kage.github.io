<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">

    <title>Kituś 🩶</title>
</head>

<body>

    <main class="page">

        <section class="box profile-box" id="profile-box">

            <div class="profile">

                <img
                    src="logo.jpeg"
                    alt="Kitsun3 Kage"
                    class="logo"
                >

                <div class="profile-text">

                    <h1 id="typing-name">
                        <span id="typing-text"></span><span class="cursor">|</span>
                    </h1>

                    <p>@kitsun3.kage</p>

                </div>

            </div>


            <div class="socials">

                <button
                    class="social-button"
                    type="button"
                    onclick="window.open('https://www.instagram.com/kitsun3.kage', '_blank')"
                    aria-label="Instagram"
                >
                    <img
                        src="instagram-icon.svg"
                        alt="Instagram"
                    >
                </button>


                <button
                    class="social-button"
                    type="button"
                    onclick="window.open('https://github.com/kitsun3kage', '_blank')"
                    aria-label="GitHub"
                >
                    <img
                        src="github-icon.svg"
                        alt="GitHub"
                    >
                </button>

                <button
                    class="social-button"
                    type="button"
                    onclick="window.open('https://www.tiktok.com/@kitsun3.kage', '_blank')"
                    aria-label="Instagram"
                >
                    <img
                        src="tiktok-icon.svg"
                        alt="TikTok"
                    >
                </button>
            </div>


            <div class="site-info">

                <div class="visitor-count">

                    <img
                        src="views.svg"
                        alt=""
                    >

                    <span id="visitor-count">...</span>

                </div>


                <span class="info-separator">|</span>


                <div class="location-info">

                    <img
                        src="location.svg"
                        alt=""
                    >

                    <span>Poland</span>

                </div>

            </div>

        </section>

    </main>


    <video
        autoplay
        muted
        loop
        playsinline
        id="background-video"
    >

        <source
            src="peaceful-meadow-moewalls-com.mp4"
            type="video/mp4"
        >

        Twoja przeglądarka nie obsługuje odtwarzania wideo.

    </video>


    <footer>

        <p>
            &copy; 2026 Kitsun3 Kage. All rights reserved.
        </p>

    </footer>


    <script>

        /* =========================================
           TYPING EFFECT
        ========================================= */

        const typingText =
            document.getElementById("typing-text");

        const text = "Kituś 🩶";

        let typingIndex = 0;

        let deleting = false;


        function typingAnimation() {

            if (!typingText) {
                return;
            }


            if (!deleting) {

                /* Wpisywanie */

                if (typingIndex < text.length) {

                    typingText.textContent =
                        text.substring(
                            0,
                            typingIndex + 1
                        );

                    typingIndex++;

                    setTimeout(
                        typingAnimation,
                        110
                    );

                } else {

                    /* Tekst jest gotowy */

                    deleting = true;

                    setTimeout(
                        typingAnimation,
                        1500
                    );

                }

            } else {

                /* Usuwanie */

                if (typingIndex > 0) {

                    typingIndex--;

                    typingText.textContent =
                        text.substring(
                            0,
                            typingIndex
                        );

                    setTimeout(
                        typingAnimation,
                        70
                    );

                } else {

                    /* Tekst całkowicie usunięty */

                    deleting = false;

                    setTimeout(
                        typingAnimation,
                        700
                    );

                }

            }

        }


        typingAnimation();


        /* =========================================
           VISITOR COUNTER
        ========================================= */

        const visitorCount =
            document.getElementById("visitor-count");


        const counterUrl =
            "https://api.counterapi.dev/v2/kitsun3kage-portfolio/kitu-portfolio-2026/up";


        async function updateVisitorCount() {

            if (!visitorCount) {
                return;
            }


            try {

                const response =
                    await fetch(counterUrl);


                if (!response.ok) {
                    throw new Error(
                        "Counter request failed"
                    );
                }


                const data =
                    await response.json();


                if (
                    data &&
                    data.count !== undefined
                ) {

                    visitorCount.textContent =
                        data.count.toLocaleString(
                            "pl-PL"
                        );

                } else {

                    visitorCount.textContent = "0";

                }

            } catch (error) {

                console.error(
                    "Nie udało się pobrać licznika odwiedzin:",
                    error
                );

                visitorCount.textContent = "0";

            }

        }


        updateVisitorCount();


        /* =========================================
           3D MOUSE TILT
        ========================================= */

        const tiltBox =
            document.querySelector(
                ".profile-box"
            );


        const desktopPointer =
            window.matchMedia(
                "(hover: hover) and (pointer: fine)"
            );


        if (
            tiltBox &&
            desktopPointer.matches
        ) {

            tiltBox.addEventListener(
                "mousemove",
                (event) => {

                    const rect =
                        tiltBox.getBoundingClientRect();


                    const x =
                        event.clientX -
                        rect.left;


                    const y =
                        event.clientY -
                        rect.top;


                    const centerX =
                        rect.width / 2;


                    const centerY =
                        rect.height / 2;


                    const rotateY =
                        (
                            (x - centerX) /
                            centerX
                        ) * -6;


                    const rotateX =
                        (
                            (centerY - y) /
                            centerY
                        ) * -6;


                    tiltBox.style.transform = `
                        perspective(1000px)
                        rotateX(${rotateX}deg)
                        rotateY(${rotateY}deg)
                    `;

                }
            );


            tiltBox.addEventListener(
                "mouseleave",
                () => {

                    tiltBox.style.transform = `
                        perspective(1000px)
                        rotateX(0deg)
                        rotateY(0deg)
                    `;

                }
            );

        }

    </script>

</body>
</html>

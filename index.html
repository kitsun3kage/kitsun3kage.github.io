    <!-- =====================================================
         TYPING ANIMATION
    ====================================================== -->

    <script>

        const text = "Kituś 🩶";

        const typingElement =
            document.getElementById(
                "typing-text"
            );

        let typingIndex = 0;


        function typeText() {

            if (typingIndex < text.length) {

                typingIndex++;

                typingElement.textContent =
                    text.slice(
                        0,
                        typingIndex
                    );

                setTimeout(
                    typeText,
                    130
                );

            } else {

                setTimeout(
                    deleteText,
                    900
                );

            }

        }


        function deleteText() {

            if (typingIndex > 0) {

                typingIndex--;

                typingElement.textContent =
                    text.slice(
                        0,
                        typingIndex
                    );

                setTimeout(
                    deleteText,
                    55
                );

            } else {

                setTimeout(
                    typeText,
                    350
                );

            }

        }


        typeText();

    </script>


    <!-- =====================================================
         VISITOR COUNTER
    ====================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/counterapi/dist/counter.browser.min.js"></script>

    <script>

        const counter =
            new Counter({
                workspace: "TWOJ_WORKSPACE"
            });


        counter
            .up("visitors")
            .then(result => {

                const visitorElement =
                    document.getElementById(
                        "visitor-count"
                    );

                visitorElement.textContent =
                    result.value;

            })
            .catch(() => {

                const visitorElement =
                    document.getElementById(
                        "visitor-count"
                    );

                visitorElement.textContent =
                    "0";

            });

    </script>


    <!-- =====================================================
         SPOTIFY CONFIG
    ====================================================== -->

    <script>

        /*
         * Cloudflare Worker
         */

        const SPOTIFY_API =
            "https://kitsun3kage-spotify.kitsun3-kage.workers.dev";


        /*
         * Spotify DOM elements
         */

        const spotifyBox =
            document.getElementById(
                "spotify-box"
            );


        const spotifyContent =
            document.getElementById(
                "spotify-content"
            );


        const spotifyEmpty =
            document.getElementById(
                "spotify-empty"
            );


        const spotifyCover =
            document.getElementById(
                "spotify-cover"
            );


        const spotifyCoverPlaceholder =
            document.getElementById(
                "spotify-cover-placeholder"
            );


        const spotifyTitle =
            document.getElementById(
                "spotify-title"
            );


        const spotifyArtist =
            document.getElementById(
                "spotify-artist"
            );


        const spotifyStatus =
            document.getElementById(
                "spotify-status"
            );


        const spotifyProgressBar =
            document.getElementById(
                "spotify-progress-bar"
            );


        const spotifyCurrentTime =
            document.getElementById(
                "spotify-current-time"
            );


        const spotifyDuration =
            document.getElementById(
                "spotify-duration"
            );


        /*
         * Spotify state
         */

        let spotifyProgressMs = 0;

        let spotifyDurationMs = 0;

        let spotifyPlaying = false;

        let spotifyTrackId = null;


        /* =================================================
           FORMAT TIME
        ================================================= */

        function formatTime(milliseconds) {

            if (
                !milliseconds ||
                milliseconds < 0
            ) {

                return "0:00";

            }


            const totalSeconds =
                Math.floor(
                    milliseconds / 1000
                );


            const minutes =
                Math.floor(
                    totalSeconds / 60
                );


            const seconds =
                totalSeconds % 60;


            return (
                `${minutes}:${String(seconds).padStart(2, "0")}`
            );

        }


        /* =================================================
           SHOW EMPTY STATE
        ================================================= */

        function showSpotifyEmpty(
            statusText = "OFFLINE"
        ) {

            spotifyContent.classList.add(
                "is-hidden"
            );


            spotifyEmpty.classList.remove(
                "is-hidden"
            );


            spotifyStatus.textContent =
                statusText;


            spotifyBox.classList.remove(
                "spotify-active"
            );


            spotifyProgressBar.style.width =
                "0%";


            spotifyCurrentTime.textContent =
                "0:00";


            spotifyDuration.textContent =
                "0:00";


            spotifyPlaying =
                false;

        }


        /* =================================================
           SHOW CURRENT TRACK
        ================================================= */

        function showSpotifyTrack(data) {

            if (
                !data ||
                !data.track
            ) {

                showSpotifyEmpty(
                    "OFFLINE"
                );

                return;

            }


            const track =
                data.track;


            spotifyContent.classList.remove(
                "is-hidden"
            );


            spotifyEmpty.classList.add(
                "is-hidden"
            );


            /* Track name */

            spotifyTitle.textContent =
                track.name ||
                "Unknown track";


            /* Artist */

            spotifyArtist.textContent =
                track.artists ||
                "Unknown artist";


            /* Spotify URL */

            if (track.spotifyUrl) {

                spotifyTitle.href =
                    track.spotifyUrl;

            } else {

                spotifyTitle.removeAttribute(
                    "href"
                );

            }


            /* Album cover */

            if (track.image) {

                spotifyCover.src =
                    track.image;

                spotifyCover.alt =
                    `${track.name || "Track"} cover`;

                spotifyCover.classList.add(
                    "is-visible"
                );


                spotifyCoverPlaceholder.classList.add(
                    "is-hidden"
                );

            } else {

                spotifyCover.removeAttribute(
                    "src"
                );


                spotifyCover.classList.remove(
                    "is-visible"
                );


                spotifyCoverPlaceholder.classList.remove(
                    "is-hidden"
                );

            }


            /* Progress */

            spotifyProgressMs =
                Number(
                    data.progressMs || 0
                );


            spotifyDurationMs =
                Number(
                    data.durationMs || 0
                );


            spotifyPlaying =
                Boolean(
                    data.playing
                );


            spotifyTrackId =
                track.id || null;


            /* Status */

            spotifyStatus.textContent =
                spotifyPlaying
                    ? "PLAYING"
                    : "PAUSED";


            spotifyBox.classList.toggle(
                "spotify-active",
                spotifyPlaying
            );


            updateSpotifyProgress();

        }


        /* =================================================
           UPDATE PROGRESS BAR
        ================================================= */

        function updateSpotifyProgress() {

            if (
                !spotifyDurationMs ||
                spotifyDurationMs <= 0
            ) {

                spotifyProgressBar.style.width =
                    "0%";

            } else {

                const percentage =
                    Math.min(
                        100,
                        Math.max(
                            0,
                            (
                                spotifyProgressMs /
                                spotifyDurationMs
                            ) * 100
                        )
                    );


                spotifyProgressBar.style.width =
                    `${percentage}%`;

            }


            spotifyCurrentTime.textContent =
                formatTime(
                    spotifyProgressMs
                );


            spotifyDuration.textContent =
                formatTime(
                    spotifyDurationMs
                );

        }


        /* =================================================
           FETCH SPOTIFY
        ================================================= */

        async function updateSpotify() {

            try {

                const response =
                    await fetch(
                        `${SPOTIFY_API}/api/currently-playing`,
                        {
                            method: "GET",
                            cache: "no-store"
                        }
                    );


                /*
                 * Worker doesn't have
                 * Spotify authorization.
                 */

                if (
                    response.status === 401
                ) {

                    showSpotifyEmpty(
                        "NOT CONNECTED"
                    );

                    return;

                }


                /*
                 * Other server error.
                 */

                if (!response.ok) {

                    showSpotifyEmpty(
                        "OFFLINE"
                    );

                    return;

                }


                const data =
                    await response.json();


                /*
                 * Not connected.
                 */

                if (
                    !data.connected
                ) {

                    showSpotifyEmpty(
                        "NOT CONNECTED"
                    );

                    return;

                }


                /*
                 * Nothing playing.
                 */

                if (
                    !data.playing ||
                    !data.track
                ) {

                    showSpotifyEmpty(
                        "NOT PLAYING"
                    );

                    return;

                }


                /*
                 * Track found.
                 */

                showSpotifyTrack(
                    data
                );

            } catch (error) {

                console.error(
                    "Spotify error:",
                    error
                );


                showSpotifyEmpty(
                    "OFFLINE"
                );

            }

        }


        /*
         * First request immediately.
         */

        updateSpotify();


        /*
         * Synchronize with Spotify
         * every 15 seconds.
         */

        setInterval(
            updateSpotify,
            15000
        );


        /*
         * Local progress.
         *
         * Spotify remains the source
         * of truth because every 15 seconds
         * we request fresh data.
         */

        setInterval(() => {

            if (
                spotifyPlaying &&
                spotifyDurationMs > 0
            ) {

                spotifyProgressMs += 1000;


                if (
                    spotifyProgressMs >=
                    spotifyDurationMs
                ) {

                    spotifyProgressMs =
                        spotifyDurationMs;

                    spotifyPlaying =
                        false;

                }


                updateSpotifyProgress();

            }

        }, 1000);

    </script>


    <!-- =====================================================
         3D MOUSE PHYSICS
         PROFILE + SPOTIFY
    ====================================================== -->

    <script>

        /*
         * Both boxes use exactly the same
         * mouse physics.
         *
         * There is NO scale().
         * There is NO translateY().
         * Only rotateX / rotateY.
         */

        const tiltBoxes =
            document.querySelectorAll(
                ".profile-box, .spotify-box"
            );


        const desktopPointer =
            window.matchMedia(
                "(hover: hover) and (pointer: fine)"
            );


        if (desktopPointer.matches) {

            tiltBoxes.forEach(
                (tiltBox) => {

                    tiltBox.addEventListener(
                        "mousemove",
                        (event) => {

                            const rect =
                                tiltBox.getBoundingClientRect();


                            const x =
                                event.clientX -
                                rect.left;


                            const y =
                                event.clientY -
                                rect.top;


                            const centerX =
                                rect.width / 2;


                            const centerY =
                                rect.height / 2;


                            /*
                             * Exactly the same
                             * calculation for both boxes.
                             */

                            const rotateY =
                                (
                                    (x - centerX) /
                                    centerX
                                ) * -6;


                            const rotateX =
                                (
                                    (centerY - y) /
                                    centerY
                                ) * -6;


                            tiltBox.style.transform =
                                `
                                perspective(1000px)
                                rotateX(${rotateX}deg)
                                rotateY(${rotateY}deg)
                                `;

                        }
                    );


                    tiltBox.addEventListener(
                        "mouseleave",
                        () => {

                            tiltBox.style.transform =
                                `
                                perspective(1000px)
                                rotateX(0deg)
                                rotateY(0deg)
                                `;

                        }
                    );

                }
            );

        }

    </script>

</body>

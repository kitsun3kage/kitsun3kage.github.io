<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">

    <title>Kituś 🩶</title>

    <style>
        .relationship-info {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9em;
            color: #ff9ecb;
            font-weight: 600;
        }

        .relationship-heart {
            font-size: 1em;
            line-height: 1;
            animation: heartPulse 1.6s infinite;
            transform-origin: center;
            display: inline-block;
        }

        @keyframes heartPulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.25);
                opacity: 0.85;
            }
        }
    </style>
</head>

<body>

    <div class="music-start-screen" id="music-start-screen">
        <div class="music-start-content">
            <h2 id="music-question">Czy chcesz włączyć muzykę?</h2>
            <div class="music-start-buttons">
                <button type="button" class="music-start-button" id="music-yes">Tak</button>
                <button type="button" class="music-start-button secondary" id="music-no">Nie</button>
            </div>
        </div>
    </div>

    <audio id="background-music" loop preload="auto" crossorigin="anonymous">
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <!-- Odtwarzacz w PRAWYM DOLNYM ROGU -->
    <div class="audio-control" id="audio-control" style="position: fixed; bottom: 20px; right: 20px; left: auto; top: auto; z-index: 100;">
        <div class="audio-control-inner">
            <div class="audio-icon">
                <span class="audio-note">♪</span>
            </div>

            <div class="audio-info" id="audio-info">
                <div class="audio-cover">
                    <img src="okladka.jpg" alt="Okładka">
                </div>
                <div class="audio-text">
                    <span class="audio-artist">Filipek, Inee, Zegar</span>
                    <span class="audio-title">Niebezpiecznie</span>
                </div>
            </div>

            <div class="audio-slider-wrapper">
                <input
                    type="range"
                    id="audio-volume"
                    min="0"
                    max="100"
                    value="50"
                    aria-label="Głośność muzyki"
                >
            </div>
        </div>
    </div>

    <main class="page">
        <section class="box profile-box" id="profile-box">
            <div class="profile">
                <img src="logo.jpeg" alt="Kitsun3 Kage" class="logo">

                    <h1 id="typing-name" style="font-weight: 700;">
                        <span id="typing-text"></span><span class="cursor">|</span>
                    </h1>
                    <p>@kitsun3.kage</p>
                </div>
            </div>

            <div class="socials">
                <button class="social-button" type="button" onclick="window.open('https://www.instagram.com/kitsun3.kage', '_blank')" aria-label="Instagram">
                    <img src="instagram-icon.svg" alt="Instagram">
                </button>
                <button class="social-button" type="button" onclick="window.open('https://github.com/kitsun3kage', '_blank')" aria-label="GitHub">
                    <img src="github-icon.svg" alt="GitHub">
                </button>
                <button class="social-button" type="button" onclick="window.open('https://www.tiktok.com/@kitsun3.kage', '_blank')" aria-label="TikTok">
                    <img src="tiktok-icon.svg" alt="TikTok">
                </button>
                <button class="social-button" type="button" onclick="window.open('https://www.youtube.com/@kitsun3kage', '_blank')" aria-label="YouTube">
                    <img src="youtube-icon.svg" alt="YouTube">
                </button>
                <button class="social-button" type="button" onclick="window.open('https://pl.wikipedia.org/wiki/Wikipedysta:Kitsun3_Kage', '_blank')" aria-label="Wikipedia">
                    <img src="wikipedia-icon.svg" alt="Wikipedia">
                </button>
            </div>

            <div class="site-info">
                <div class="visitor-count">
                    <img src="views.svg" alt="">
                    <span id="visitor-count">...</span>
                </div>
                <span class="info-separator">|</span>
                <div class="location-info">
                    <img src="location.svg" alt="">
                    <span id="country-text">Polska</span>
                </div>
                <span class="info-separator">|</span>
                <div class="relationship-info" title="Status / Relationship status">
                    <span class="relationship-heart">💗</span>
                    <span id="relationship-text">W związku</span>
                </div>
            </div>
        </section>
    </main>

    <video autoplay muted loop playsinline id="background-video">
        <source src="peaceful-meadow-moewalls-com.mp4" type="video/mp4">
        Twoja przeglądarka nie obsługuje odtwarzania wideo.
    </video>

    <footer>
        <p>&copy; 2026 Kitsun3 Kage. All rights reserved.</p>
    </footer>

    <script>
        const musicStartScreen = document.getElementById("music-start-screen");
        const musicYes = document.getElementById("music-yes");
        const musicNo = document.getElementById("music-no");
        const backgroundMusic = document.getElementById("background-music");
        const audioControl = document.getElementById("audio-control");
        const audioVolume = document.getElementById("audio-volume");
        const profileBox = document.getElementById("profile-box");

        // Płynna animacja zamykania ekranu startowego
        function closeMusicScreen() {
            musicStartScreen.classList.add("hidden");
            setTimeout(() => {
                musicStartScreen.style.display = "none";
            }, 500);
        }

        function updateVolumeState() {
            const volume = Number(audioVolume.value);
            backgroundMusic.volume = volume / 100;
            audioVolume.style.setProperty("--volume", `${volume}%`);

            if (volume === 0) {
                audioControl.classList.add("muted");
            } else {
                audioControl.classList.remove("muted");
            }
        }

        // --- PŁYNNY BASS SHAKE & TILT 3D LOOP ---
        let audioCtx, analyser, dataArray, sourceNode;
        let isAudioSetup = false;
        let targetTiltX = 0, currentTiltX = 0;
        let targetTiltY = 0, currentTiltY = 0;

        let targetShakeX = 0, currentShakeX = 0;
        let targetShakeY = 0, currentShakeY = 0;
        let targetScale = 1, currentScale = 1;

        function initAudioAnalyser() {
            if (isAudioSetup) return;
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                analyser = audioCtx.createAnalyser();
                
                analyser.fftSize = 256; 
                analyser.smoothingTimeConstant = 0; 

                sourceNode = audioCtx.createMediaElementSource(backgroundMusic);
                sourceNode.connect(analyser);
                analyser.connect(audioCtx.destination);

                dataArray = new Uint8Array(analyser.frequencyBinCount);
                isAudioSetup = true;
            } catch (e) {
                console.warn("Nie można uruchomić analizatora AudioContext:", e);
            }
        }

        function lerp(start, end, amt) {
            return (1 - amt) * start + amt * end;
        }

        function renderLoop() {
            requestAnimationFrame(renderLoop);

            // Obliczanie basu tylko gdy muzyka gra i nie jest wyciszona
            if (!analyser || backgroundMusic.paused || backgroundMusic.volume === 0) {
                targetShakeX = 0;
                targetShakeY = 0;
                targetScale = 1;
            } else {
                analyser.getByteFrequencyData(dataArray);

                const sampleRate = audioCtx.sampleRate || 44100;
                const nyquist = sampleRate / 2;
                let binCount = analyser.frequencyBinCount; 

                // Pasmo niskiego basu: 30Hz - 130Hz
                let startBin = Math.floor((30 / nyquist) * binCount);
                let endBin = Math.ceil((130 / nyquist) * binCount);

                startBin = Math.max(0, startBin);
                endBin = Math.min(binCount - 1, Math.max(startBin + 1, endBin));

                let bassSum = 0;
                for (let i = startBin; i <= endBin; i++) {
                    bassSum += dataArray[i];
                }
                let count = (endBin - startBin + 1);
                let rawBass = (bassSum / count) / 255;

                const outputMultiplier = 56;
                let bassValue = rawBass * outputMultiplier;

                // Próg (8.0) - trzęsie TYLKO przy mocniejszym basie
                const threshold = 8.0;

                if (bassValue > threshold) {
                    const intensity = Math.min((bassValue - threshold) / (outputMultiplier - threshold), 1.0);

                    targetShakeX = (Math.random() - 0.5) * intensity * 22;
                    targetShakeY = (Math.random() - 0.5) * intensity * 22;
                    targetScale = 1 + (intensity * 0.025);
                } else {
                    targetShakeX = 0;
                    targetShakeY = 0;
                    targetScale = 1;
                }
            }

            // Płynne przejścia (LERP) dla Tilt 3D oraz drgań basu
            currentTiltX = lerp(currentTiltX, targetTiltX, 0.12);
            currentTiltY = lerp(currentTiltY, targetTiltY, 0.12);
            currentShakeX = lerp(currentShakeX, targetShakeX, 0.18);
            currentShakeY = lerp(currentShakeY, targetShakeY, 0.18);
            currentScale = lerp(currentScale, targetScale, 0.15);

            if (profileBox) {
                profileBox.style.transform = `perspective(1000px) rotateX(${currentTiltX.toFixed(2)}deg) rotateY(${currentTiltY.toFixed(2)}deg) translate(${currentShakeX.toFixed(2)}px, ${currentShakeY.toFixed(2)}px) scale(${currentScale.toFixed(4)})`;
            }
        }

        // Uruchomienie pętli natychmiast, aby Tilt 3D działał nawet przy wybranej opcji "Nie"
        renderLoop();

        musicYes.addEventListener("click", async () => {
            updateVolumeState();
            try {
                await backgroundMusic.play();
                initAudioAnalyser();
                if (audioCtx && audioCtx.state === "suspended") {
                    await audioCtx.resume();
                }

                // --- Media Session API (pokazywanie utworu w systemie) ---
                if ('mediaSession' in navigator) {
                    navigator.mediaSession.metadata = new MediaMetadata({
                        title: 'Niebezpiecznie',
                        artist: 'Filipek, Inee, Zegar',
                        album: 'Kituś 🩶',
                        artwork: [
                            { src: 'okladka.jpg', sizes: '512x512', type: 'image/jpeg' }
                        ]
                    });
                }
            } catch (error) {
                console.error("Nie udało się uruchomić muzyki:", error);
            }
            closeMusicScreen();
        });

        musicNo.addEventListener("click", () => {
            backgroundMusic.pause();
            backgroundMusic.currentTime = 0;
            audioVolume.value = 0;
            updateVolumeState();
            
            // Ukrycie odtwarzacza po kliknięciu "Nie"
            audioControl.style.opacity = "0";
            audioControl.style.transition = "opacity 0.4s ease";
            setTimeout(() => {
                audioControl.style.display = "none";
            }, 400);

            closeMusicScreen();
        });

        audioVolume.addEventListener("input", updateVolumeState);
        updateVolumeState();

        // Animacja wpisywania tekstu
        const typingText = document.getElementById("typing-text");
        const text = "Kituś 🩶";
        let typingIndex = 0;
        let deleting = false;

        function typingAnimation() {
            if (!typingText) return;

            if (!deleting) {
                if (typingIndex < text.length) {
                    typingText.textContent = text.substring(0, typingIndex + 1);
                    typingIndex++;
                    setTimeout(typingAnimation, 110);
                } else {
                    deleting = true;
                    setTimeout(typingAnimation, 1500);
                }
            } else {
                if (typingIndex > 0) {
                    typingIndex--;
                    typingText.textContent = text.substring(0, typingIndex);
                    setTimeout(typingAnimation, 70);
                } else {
                    deleting = false;
                    setTimeout(typingAnimation, 700);
                }
            }
        }
        typingAnimation();

        // Licznik odwiedzin
        const visitorCount = document.getElementById("visitor-count");
        const counterUrl = "https://api.counterapi.dev/v2/kitsun3kage-portfolio/kitu-portfolio-2026/up";

        async function updateVisitorCount() {
            if (!visitorCount) return;
            try {
                const response = await fetch(counterUrl);
                if (!response.ok) throw new Error("Counter request failed");
                const data = await response.json();
                if (data && data.data && data.data.up_count !== undefined) {
                    visitorCount.textContent = data.data.up_count.toLocaleString("pl-PL");
                } else {
                    visitorCount.textContent = "0";
                }
            } catch (error) {
                console.error("Nie udało się pobrać licznika odwiedzin:", error);
                visitorCount.textContent = "0";
            }
        }
        updateVisitorCount();

        // Obsługa Tilt 3D myszką (działa ZAWSZE, niezależnie od muzyki)
        const desktopPointer = window.matchMedia("(hover: hover) and (pointer: fine)");

        if (profileBox && desktopPointer.matches) {
            profileBox.addEventListener("mousemove", (event) => {
                const rect = profileBox.getBoundingClientRect();
                const x = event.clientX - rect.left;
                const y = event.clientY - rect.top;
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                targetTiltY = ((x - centerX) / centerX) * -6;
                targetTiltX = ((centerY - y) / centerY) * -6;
            });

            profileBox.addEventListener("mouseleave", () => {
                targetTiltX = 0;
                targetTiltY = 0;
            });
        }

        // --- Automatyczne wykrywanie języka: status, kraj, ekran muzyki ---
        const relationshipText = document.getElementById("relationship-text");
        const countryText = document.getElementById("country-text");
        const musicQuestion = document.getElementById("music-question");

        function getBrowserLanguage() {
            return (navigator.language || navigator.userLanguage || "en")
                .toLowerCase()
                .split("-")[0];
        }

        function applyLanguage() {
            const lang = getBrowserLanguage();

            if (relationshipText) {
                relationshipText.textContent = relationshipLabels[lang] || relationshipLabels.en;
            }
            if (countryText) {
                countryText.textContent = countryLabels[lang] || countryLabels.en;
            }
            if (musicQuestion) {
                musicQuestion.textContent = musicQuestionLabels[lang] || musicQuestionLabels.en;
            }
            if (musicYes) {
                musicYes.textContent = yesLabels[lang] || yesLabels.en;
            }
            if (musicNo) {
                musicNo.textContent = noLabels[lang] || noLabels.en;
            }
            if (audioVolume) {
                audioVolume.setAttribute("aria-label", volumeLabels[lang] || volumeLabels.en);
            }
        }

        applyLanguage();
    </script>
